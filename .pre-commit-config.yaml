ci:
  autoupdate_schedule: "quarterly"
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: trailing-whitespace
  - id: debug-statements
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.10
  hooks:
    - id: ruff
    - id: ruff-format
- repo: https://github.com/tox-dev/pyproject-fmt
  rev: v2.30.1
  hooks:
    - id: pyproject-fmt
